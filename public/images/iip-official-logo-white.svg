<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 6 94 92" fill="none">
  <!-- Tilted gold card -->
  <rect x="63" y="8" width="40" height="40" rx="4" transform="rotate(16 83 28)" fill="#f6b803" />

  <!-- First 'i' dot & stem -->
  <circle cx="28" cy="30" r="5.5" fill="#b0b0b0" />
  <path d="M 22.5 40.5 C 24.5 43, 31.5 43, 33.5 40.5 L 33.5 73.5 L 22.5 73.5 Z" fill="#ffffff" />

  <!-- Second 'i' dot & stem -->
  <circle cx="44.5" cy="30" r="5.5" fill="#b0b0b0" />
  <path d="M 39 40.5 C 41 43, 48 43, 50 40.5 L 50 73.5 L 39 73.5 Z" fill="#ffffff" />

  <!-- 'P' with stroke separating from gold card -->
  <path d="M 56.5 40.5 L 85 40.5 C 97 40.5, 104 46.5, 104 55.5 C 104 64.5, 97 70.5, 85 70.5 L 70.5 70.5 L 70.5 73.5 L 56.5 73.5 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
  <!-- Inner counter of P -->
  <path d="M 70.5 49.5 L 83 49.5 C 89 49.5, 91.5 52, 91.5 55.5 C 91.5 59, 89 61.5, 83 61.5 L 70.5 61.5 Z" fill="#111111" />

  <!-- ACADEMY text in crisp clean bold typography -->
  <text x="63" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="0.1em" fill="#ffffff">ACADEMY</text>

  <!-- (An IIP FOUNDATION Initiative) -->
  <text x="63" y="93.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="5.2" letter-spacing="0.01em" fill="#e0e0e0">(An IIP FOUNDATION Initiative)</text>
</svg>
