<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" fill="none">
  <!-- Tilted gold card -->
  <rect x="70" y="2" width="44" height="44" rx="6" transform="rotate(15 92 24)" fill="#f6b803" />
  
  <!-- First 'i' -->
  <circle cx="15" cy="16" r="6.5" fill="#888888" />
  <path d="M 8 28 C 11 31, 19 31, 22 28 L 22 68 L 8 68 Z" fill="currentColor" />
  
  <!-- Second 'i' -->
  <circle cx="37" cy="16" r="6.5" fill="#888888" />
  <path d="M 30 28 C 33 31, 41 31, 44 28 L 44 68 L 30 68 Z" fill="currentColor" />
  
  <!-- Letter 'P' -->
  <!-- White stroke to separate from yellow card -->
  <path d="M 52 28 L 82 28 C 96 28, 104 36, 104 46 C 104 56, 96 64, 82 64 L 68 64 L 68 68 L 52 68 Z" fill="currentColor" stroke="#ffffff" stroke-width="2" />
  <!-- Inner counter cutout of P -->
  <path d="M 68 39 L 81 39 C 88 39, 91 42, 91 46 C 91 50, 88 53, 81 53 L 68 53 Z" fill="#000000" class="p-cutout" />
  
  <!-- NEPAL text -->
  <text x="116" y="47" font-family="var(--font-switzer), sans-serif" font-weight="900" font-size="28" letter-spacing="0.08em" fill="currentColor">NEPAL</text>
  <text x="117" y="62" font-family="var(--font-mono), monospace" font-weight="600" font-size="9.5" letter-spacing="0.22em" fill="#f6b803">KATHMANDU</text>
</svg>
